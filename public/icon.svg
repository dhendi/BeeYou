<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Warm Cream & Subtle Honey Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="100%" stop-color="#FBF2DB" />
    </linearGradient>

    <!-- Warm Honey Golden Bee Gradient -->
    <linearGradient id="beeGold" x1="100" y1="120" x2="410" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Soft Translucent Wings -->
    <linearGradient id="wingsGrad" x1="150" y1="80" x2="380" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.75" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#78350F" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- App Rounded Squircle Frame -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#FDE68A" stroke-width="8" />

  <!-- Background Wings -->
  <ellipse cx="320" cy="160" rx="70" ry="100" transform="rotate(28 320 160)" fill="url(#wingsGrad)" stroke="#94A3B8" stroke-width="8" />
  <ellipse cx="225" cy="145" rx="80" ry="110" transform="rotate(-20 225 145)" fill="url(#wingsGrad)" stroke="#64748B" stroke-width="8" />

  <!-- Cozy Bee Body with Warm Shadow -->
  <g filter="url(#softShadow)">
    <ellipse cx="256" cy="300" rx="160" ry="135" fill="url(#beeGold)" />
  </g>

  <!-- Charcoal Navy Rounded Stripes -->
  <path d="M210 170 C226 166 280 166 298 170 C306 210 312 260 308 300 C304 340 296 390 286 430 C270 435 236 435 220 430 C210 390 202 340 198 300 C194 260 200 210 210 170 Z" fill="#1E293B" opacity="0.9" />
  <path d="M312 186 C326 195 352 212 360 230 C376 270 380 325 368 368 C360 386 344 398 330 406 C338 368 342 320 338 285 C334 250 326 216 312 186 Z" fill="#1E293B" opacity="0.9" />

  <!-- Tiny Gentle Stinger -->
  <path d="M96 300 C96 292 80 296 72 300 C80 304 96 308 96 300 Z" fill="#1E293B" />

  <!-- Antennas with Cute Golden Tips -->
  <path d="M330 185 C350 155 375 125 392 125" stroke="#1E293B" stroke-width="12" stroke-linecap="round" fill="none" />
  <circle cx="396" cy="122" r="16" fill="#D97706" stroke="#1E293B" stroke-width="8" />

  <path d="M290 175 C300 138 316 102 332 94" stroke="#1E293B" stroke-width="12" stroke-linecap="round" fill="none" />
  <circle cx="336" cy="92" r="16" fill="#D97706" stroke="#1E293B" stroke-width="8" />

  <!-- Gentle Reassuring Eyes -->
  <ellipse cx="350" cy="275" rx="16" ry="22" fill="#1E293B" />
  <circle cx="358" cy="268" r="6" fill="#FFFFFF" />
  
  <ellipse cx="275" cy="275" rx="16" ry="22" fill="#1E293B" />
  <circle cx="283" cy="268" r="6" fill="#FFFFFF" />

  <!-- Soft Warm Smile -->
  <path d="M300 325 Q322 340 342 325" stroke="#1E293B" stroke-width="10" stroke-linecap="round" fill="none" />

  <!-- Rosy Cheeks -->
  <circle cx="380" cy="305" r="18" fill="#F472B6" opacity="0.45" />
  <circle cx="250" cy="305" r="18" fill="#F472B6" opacity="0.45" />
</svg>