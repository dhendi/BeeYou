apply plugin: 'com.android.application'

android {
    namespace = "com.beeyou.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.beeyou.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

tasks.register('verifyProductionNetworkSecurity') {
    description = "Verifies that production assets do not include dev server live reload URLs or cleartext permissions (fail-closed)."
    doLast {
        def configFile = file('src/main/assets/capacitor.config.json')
        if (!configFile.exists()) {
            throw new GradleException("Security Violation: Missing required configuration file: ${configFile.path}. Run 'npx cap sync android' to generate production assets before building release.")
        }
        if (!configFile.canRead() || configFile.length() == 0) {
            throw new GradleException("Security Violation: Configuration file ${configFile.path} is unreadable or empty.")
        }

        def parsed
        try {
            parsed = new groovy.json.JsonSlurper().parseText(configFile.text)
        } catch (Exception e) {
            throw new GradleException("Security Violation: Malformed JSON in ${configFile.path}: ${e.message}")
        }
        if (!(parsed instanceof Map)) {
            throw new GradleException("Security Violation: Expected JSON object in ${configFile.path}")
        }

        if (parsed.server?.url != null && !parsed.server.url.toString().trim().isEmpty()) {
            throw new GradleException("Security Violation: Release build contains development server URL (${parsed.server.url}) in assets/capacitor.config.json. Restore production config with 'npx cap copy android' before building release.")
        }
        if (parsed.server?.cleartext == true) {
            throw new GradleException("Security Violation: Release build has server.cleartext set to true in assets/capacitor.config.json. Cleartext HTTP is forbidden in production.")
        }
        if (parsed.android?.allowMixedContent == true) {
            throw new GradleException("Security Violation: Release build has android.allowMixedContent set to true in assets/capacitor.config.json. Mixed content is forbidden in production.")
        }
    }
}

tasks.matching { it.name in ['preReleaseBuild', 'mergeReleaseAssets', 'packageRelease'] }.configureEach {
    dependsOn 'verifyProductionNetworkSecurity'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
